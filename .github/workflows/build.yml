name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Podcast-LDR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-LDR
          path: Podcast-LDR.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Podcast LDR v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Podcast-LDR.apk
